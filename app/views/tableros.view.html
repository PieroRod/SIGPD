            <!--Celular-->
            <script>
                let jugador = 0;

                function mostrarJugadoresCelular() {
                    document.getElementById("imagenjugadores").style.display = "flex";
                }

                function cerrarJugadoresCelular() {
                    document.getElementById("imagenjugadores").style.display = "none";
                }

                function abrirDadoCelular(x){
                    document.getElementById("dado").style.display = "flex";
                    jugador = x;   
                }

                function cambiarDadoCelular(restriccion){
                    document.getElementById("imgdado1").src = "assets/UI/dadodefault.png";
                    document.getElementById("imgdado2").src = "assets/UI/dadodefault.png";
                    document.getElementById("imgdado3").src = "assets/UI/dadodefault.png";
                    document.getElementById("imgdado4").src = "assets/UI/dadodefault.png";
                    document.getElementById("imgdado5").src = "assets/UI/dadodefault.png";

                    switch (restriccion){
                        case 1: document.getElementById(`imgdado${jugador}`).src = "assets/CARAS DADO/madera.png";
                            break;
                        case 2: document.getElementById(`imgdado${jugador}`).src = "assets/CARAS DADO/rocoso.png";
                            break;
                        case 3: document.getElementById(`imgdado${jugador}`).src = "assets/CARAS DADO/no planta.png";
                            break;
                        case 4: document.getElementById(`imgdado${jugador}`).src = "assets/CARAS DADO/rosa.png";
                            break;
                        case 5: document.getElementById(`imgdado${jugador}`).src = "assets/CARAS DADO/caja registradora.png";
                            break;
                        case 6: document.getElementById(`imgdado${jugador}`).src = "assets/CARAS DADO/estacionamiento.png";
                            break;
                        default: document.getElementById(`imgdado${jugador}`).src = "assets/CARAS DADO/dadodefault.png";
                            break;
                    }
                    document.getElementById("dado").style.display = "none";
                }

                function cerrarDadoCelular(){
                    document.getElementById("dado").style.display = "none";
                }

                function mostrarReglamentoCelular(){
                    document.getElementById("reglamento").style.display = "flex";
                }

                function cerrarReglamentoCelular(){
                    document.getElementById("reglamento").style.display = "none";
                }
            </script>
