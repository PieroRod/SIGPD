            <div class="d-flex justify-content-center mt-5">
                <div class="px-4 py-2" style="position: relative; display: inline-block;">
                    <div id="local" style="display: flex"> <!--Ranking Local-->
                        <img class="img-fluid" src="assets/UI/rank_localCEL.png" width="530px">

                    <div id="global" style="display: none"> <!--Ranking Global-->
                        <img class="img-fluid" src="assets/UI/rank_globalCEL.png" width="530px">
                    </div>

                    <button onclick="cambiaraLocal()" class="btn btn-sm" style="position: absolute; top: 0; left: 0;"><img id="izquierda" src="assets/UI/ianc_izq.png" width="90px"></button>
                    <button onclick="cambiaraGlobal()" class="btn btn-sm" style="position: absolute; top: 0; left: 470px;"><img id="derecha" src="assets/UI/act_der.png" width="90px"></button>

            </div>
            
            <button class="btn btn-sm mx-auto d-block mt-3"><a href="index.php?ruta=logout"><img src="assets/UI/Volver_inicio.png" width="300px"></a></button>

        <!--Celular-->
        <!-- #region -->
        <main class="d-block d-sm-none ms-2">
            <div class="ms-5 mt-3">
                <p class="ms-1" style="font-size: 30px; font-family: 'Berlin Sans FB Demi'; color: #750708;">¡Jugador x ganó!</p>
            </div>
            <!--Ranking-->
            <div class="mt-1 pt-1 px-4" style="position: relative; display: inline-block;">
                <div id="local" style="display: flex"> <!--Ranking Local-->
                    <img class="img-fluid" src="assets/UI/rank_localCEL.png" style="width: 100%; max-width: 270px;">
                </div>
                <div id="global" style="display: none"> <!--Ranking Global-->
                    <img class="img-fluid" src="assets/UI/rank_globalCEL.png" style="width: 100%; max-width: 265px;">
                </div>

                <!--Cambiar de ranking-->
                <button onclick="cambiaraLocal()" class="btn btn-sm" style="position: absolute; top: 0; left: 0;"><img id="izquierda" src="assets/UI/ianc_izq.png" width="50px"></button>
                <button onclick="cambiaraGlobal()" class="btn btn-sm" style="position: absolute; top: 0; left: 255px;"><img id="derecha" src="assets/UI/act_der.png" width="50px"></button>
            </div>

            <div class="ms-4 ps-1 mt-2">

            </div>

        <!-- #endregion -->

         <script>
            let derecha = 1;

            function cambiaraGlobal(){
                if (derecha == 1){
                    document.getElementById("global").style.display = "flex";
                    document.getElementById("local").style.display = "none";

                    document.getElementById("izquierda").src = "assets/UI/act_izq.png";
                    document.getElementById("derecha").src = "assets/UI/inac_der.png";

                    derecha = 0;
                    izquierda = 1;
                }
            }

            function cambiaraLocal(){
                if (derecha == 0){
                    document.getElementById("global").style.display = "none";
                    document.getElementById("local").style.display = "flex";

                    document.getElementById("izquierda").src = "assets/UI/ianc_izq.png";
                    document.getElementById("derecha").src = "assets/UI/act_der.png";

                    derecha = 1;
                }

            }
        </script>
