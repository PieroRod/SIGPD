    <script>
        let paginaT = 1;
        function mostrarAyudaTablet(){
                document.getElementById("ayudaTablet").style.display = "flex";
        }

        function cerrarAyudaTablet(){
            document.getElementById("ayudaTablet").style.display = "none";
        }

        function cambiarPagAyudaTablet(x){
                paginaT += x;

                if (paginaT > 3){
                    paginaT = 1;
                }

                if (paginaT < 1){
                    paginaT = 3
                }

                switch(paginaT){
                    case 1:
                        document.getElementById("ayudaPaginaTablet").src = "assets/ManualCelular/1.png";
                        break;                   
                    case 2:
                        document.getElementById("ayudaPaginaTablet").src = "assets/ManualCelular/2.png";
                        break;
                    case 3:
                        document.getElementById("ayudaPaginaTablet").src = "assets/ManualCelular/3.png";
                        break;
                    default:
                        document.getElementById("ayudaPaginaTablet").src = "assets/ManualCelular/1.png";
                        break;
                }       
            }
    </script>

    <script>
        let pagina = 1;
        function mostrarAyudaCompu(){
                document.getElementById("ayudaCompu").style.display = "flex";
        }

        function cerrarAyudaCompu(){
            document.getElementById("ayudaCompu").style.display = "none";
        }

        function cambiarPagAyudaCompu(x){
                pagina += x;

                if (pagina > 5){
                    pagina = 1;
                }

                if (pagina < 1){
                    pagina = 5
                }

                switch(pagina){
                    case 1:
                        document.getElementById("ayudaPaginaCompu").src = "assets/ManualCompu/1.png";
                        break;                   
                    case 2:
                        document.getElementById("ayudaPaginaCompu").src = "assets/ManualCompu/2.png";
                        break;
                    case 3:
                        document.getElementById("ayudaPaginaCompu").src = "assets/ManualCompu/3.png";
                        break;
                    case 4:
                        document.getElementById("ayudaPaginaCompu").src = "assets/ManualCompu/4.png";
                        break;
                    case 5:
                        document.getElementById("ayudaPaginaCompu").src = "assets/ManualCompu/5.png";
                        document.getElementById("ayudaPaginaCompu").style = "position: absolute; width: 90%; top: 5%;";
                        break;
                    default:
                        document.getElementById("ayudaPaginaCompu").src = "assets/ManualCompu/1.png";
                        break;
                }       
            }
    </script>
